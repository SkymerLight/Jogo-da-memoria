<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anotador da Memória</title>
<style>
  :root {
    --fundo: #0d0714;
    --painel: #160d22;
    --borda: #3a2550;
    --texto: #f3e9ff;
    --suave: #b9a3d4;
    --laranja: #ff7a1a;
    --verde: #3cff8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--borda); background: var(--painel);
  }
  header h1 { font-size: 16px; margin: 0; color: #ffb36b; flex: 1; min-width: 180px; }
  button, select {
    background: #2a1a3d; color: var(--texto); border: 1px solid #4b3166;
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover { border-color: var(--laranja); }
  button.ativo { border-color: var(--laranja); background: #3a2210; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 420px); gap: 16px; padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 12px; }
  .caixa h2 { font-size: 13px; margin: 0 0 8px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  #area {
    position: relative; border: 2px dashed var(--borda); border-radius: 10px;
    min-height: 260px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #08040d;
  }
  #area.arrastando { border-color: var(--laranja); }
  #area canvas { max-width: 100%; display: block; cursor: crosshair; }
  #vazio { color: var(--suave); text-align: center; padding: 24px; }
  #vazio kbd { background: #2a1a3d; border: 1px solid #4b3166; border-radius: 4px; padding: 1px 6px; }
  #status { margin-top: 8px; color: var(--suave); min-height: 1.4em; }
  #tabuleiro { display: grid; gap: 6px; }
  .cel {
    position: relative; aspect-ratio: 223 / 348; border-radius: 6px; overflow: hidden;
    background: #24163a; border: 2px solid var(--borda);
    display: flex; align-items: center; justify-content: center; color: #6d5689; font-weight: 700;
  }
  .cel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cel .num {
    position: absolute; top: 3px; left: 4px; font-size: 11px; color: #fff;
    text-shadow: 0 0 3px #000, 0 0 3px #000; font-weight: 700;
  }
  .cel .grupo {
    position: absolute; bottom: 3px; right: 3px; font-size: 11px; font-weight: 800;
    background: rgba(0,0,0,.75); border-radius: 4px; padding: 0 5px;
  }
  .cel.feito { opacity: .35; }
  .cel button.x {
    position: absolute; top: 2px; right: 2px; padding: 0 5px; font-size: 11px;
    border-radius: 4px; display: none;
  }
  .cel:hover button.x { display: block; }
  #pares { margin-top: 12px; }
  .par { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--borda); }
  .par b { font-size: 15px; }
  .par button { padding: 2px 8px; font-size: 12px; }
  .par.feito { opacity: .45; text-decoration: line-through; }
  .controles { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .dica { color: var(--suave); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🎃 Anotador da Memória</h1>
  <button id="btnMarcar">Marcar tabuleiro</button>
  <label class="dica">Grade
    <select id="selGrade">
      <option value="5x4">5 × 4</option>
      <option value="4x4">4 × 4</option>
      <option value="6x4">6 × 4</option>
      <option value="6x5">6 × 5</option>
    </select>
  </label>
  <button id="btnLimpar">Nova rodada</button>
</header>
<main>
  <section class="caixa">
    <h2>Print</h2>
    <div id="area">
      <div id="vazio">
        Tire um print (<kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> ou <kbd>PrtSc</kbd>)<br>
        e aperte <kbd>Ctrl</kbd>+<kbd>V</kbd> aqui. Também dá para arrastar uma imagem.
      </div>
      <canvas id="tela" hidden></canvas>
    </div>
    <div id="status"></div>
  </section>
  <section class="caixa">
    <h2>Tabuleiro anotado</h2>
    <div id="tabuleiro"></div>
    <div id="pares"></div>
  </section>
</main>
<script>
(() => {
  const CHAVE = 'anotador-memoria';
  const LARG = 24, ALT = 36, DESLOC = 5;
  const LIMIAR_VERSO = 28;
  const LIMIAR_IGUAL = 30;
  const CORES = ['#3cff8f', '#ffd23c', '#3cc8ff', '#ff5ca8', '#b77bff', '#ff8a3c', '#7dffea', '#ff4d4d', '#a8ff3c', '#ffffff'];

  const $ = (s) => document.querySelector(s);
  const tela = $('#tela');
  const ctx = tela.getContext('2d', { willReadFrequently: true });
  const area = $('#area');

  let estado = carregar();
  let imagem = null;
  let marcando = false;
  let inicio = null;
  let selecaoTemp = null;

  function carregar() {
    try {
      const e = JSON.parse(localStorage.getItem(CHAVE));
      if (e) return e;
    } catch (e) {}
    return { grade: '5x4', area: null, verso: null, cartas: {}, feitos: [] };
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { status('Não consegui salvar (armazenamento cheio?)'); }
  }

  function dims() {
    const [c, l] = estado.grade.split('x').map(Number);
    return { colunas: c, linhas: l, total: c * l };
  }

  function status(t) { $('#status').textContent = t; }

  function retanguloCelula(i) {
    const { colunas, linhas } = dims();
    const a = estado.area;
    const w = a.w / colunas, h = a.h / linhas;
    const col = i % colunas, lin = Math.floor(i / colunas);
    const mx = w * 0.1, my = h * 0.08;
    return { x: a.x + col * w + mx, y: a.y + lin * h + my, w: w - 2 * mx, h: h - 2 * my };
  }

  function assinatura(r) {
    const c = document.createElement('canvas');
    c.width = LARG; c.height = ALT;
    const cx = c.getContext('2d', { willReadFrequently: true });
    cx.drawImage(imagem, r.x, r.y, r.w, r.h, 0, 0, LARG, ALT);
    const d = cx.getImageData(0, 0, LARG, ALT).data;
    const v = [];
    for (let i = 0; i < d.length; i += 4) v.push(d[i], d[i + 1], d[i + 2]);
    return v;
  }

  function distancia(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
  }

  function semelhanca(a, b) {
    let melhor = Infinity;
    for (let dy = -DESLOC; dy <= DESLOC; dy++) {
      for (let dx = -DESLOC; dx <= DESLOC; dx++) {
        let s = 0, n = 0;
        for (let y = DESLOC; y < ALT - DESLOC; y++) {
          for (let x = DESLOC; x < LARG - DESLOC; x++) {
            const i = (y * LARG + x) * 3;
            const j = ((y + dy) * LARG + (x + dx)) * 3;
            s += Math.abs(a[i] - b[j]) + Math.abs(a[i + 1] - b[j + 1]) + Math.abs(a[i + 2] - b[j + 2]);
            n += 3;
          }
        }
        melhor = Math.min(melhor, s / n);
      }
    }
    return melhor;
  }

  function mediana(vetores) {
    const n = vetores[0].length;
    const m = new Array(n);
    for (let i = 0; i < n; i++) {
      const col = vetores.map((v) => v[i]).sort((x, y) => x - y);
      m[i] = col[Math.floor(col.length / 2)];
    }
    return m;
  }

  function recorte(r) {
    const c = document.createElement('canvas');
    const escala = Math.min(1, 160 / r.w);
    c.width = Math.round(r.w * escala);
    c.height = Math.round(r.h * escala);
    c.getContext('2d').drawImage(imagem, r.x, r.y, r.w, r.h, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  }

  function processar() {
    if (!imagem || !estado.area) return;
    const { total } = dims();
    const assinaturas = [];
    for (let i = 0; i < total; i++) assinaturas.push(assinatura(retanguloCelula(i)));
    if (!estado.verso) estado.verso = mediana(assinaturas);
    let novas = 0;
    const viradas = [];
    assinaturas.forEach((a, i) => {
      if (distancia(a, estado.verso) <= LIMIAR_VERSO) return;
      viradas.push(i + 1);
      const atual = estado.cartas[i];
      if (atual && semelhanca(atual.sig, a) <= LIMIAR_IGUAL) return;
      estado.cartas[i] = { sig: a, img: recorte(retanguloCelula(i)) };
      novas++;
    });
    salvar();
    render();
    desenhar();
    status(viradas.length
      ? `Cartas viradas no print: ${viradas.join(', ')} · ${novas} nova(s) anotada(s).`
      : 'Nenhuma carta virada encontrada nesse print. Confira se o tabuleiro está marcado certo.');
  }

  function grupos() {
    const idx = Object.keys(estado.cartas).map(Number).sort((a, b) => a - b);
    const lista = [];
    const usado = new Set();
    idx.forEach((i) => {
      if (usado.has(i)) return;
      const g = [i];
      usado.add(i);
      idx.forEach((j) => {
        if (usado.has(j)) return;
        if (semelhanca(estado.cartas[i].sig, estado.cartas[j].sig) <= LIMIAR_IGUAL) { g.push(j); usado.add(j); }
      });
      lista.push(g);
    });
    return lista;
  }

  function render() {
    const { colunas, total } = dims();
    const tab = $('#tabuleiro');
    tab.style.gridTemplateColumns = `repeat(${colunas}, 1fr)`;
    tab.innerHTML = '';
    const gs = grupos();
    const pares = gs.filter((g) => g.length >= 2);
    const corDe = {};
    pares.forEach((g, n) => g.forEach((i) => { corDe[i] = { cor: CORES[n % CORES.length], n: n + 1 }; }));
    const feitos = new Set(estado.feitos);

    for (let i = 0; i < total; i++) {
      const cel = document.createElement('div');
      cel.className = 'cel';
      const c = estado.cartas[i];
      if (c) {
        const img = document.createElement('img');
        img.src = c.img;
        cel.appendChild(img);
        const x = document.createElement('button');
        x.className = 'x';
        x.textContent = '×';
        x.title = 'Apagar anotação desta posição';
        x.onclick = () => { delete estado.cartas[i]; estado.feitos = estado.feitos.filter((f) => f !== i); salvar(); render(); };
        cel.appendChild(x);
        if (corDe[i]) {
          cel.style.borderColor = corDe[i].cor;
          cel.style.boxShadow = feitos.has(i) ? 'none' : `0 0 10px ${corDe[i].cor}`;
          const g = document.createElement('span');
          g.className = 'grupo';
          g.style.color = corDe[i].cor;
          g.textContent = `P${corDe[i].n}`;
          cel.appendChild(g);
        }
        if (feitos.has(i)) cel.classList.add('feito');
      } else {
        cel.append('?');
      }
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = i + 1;
      cel.appendChild(num);
      tab.appendChild(cel);
    }

    const box = $('#pares');
    box.innerHTML = '';
    const vistas = Object.keys(estado.cartas).length;
    const abertos = pares.filter((g) => !g.every((i) => feitos.has(i)));
    const info = document.createElement('div');
    info.className = 'dica';
    info.textContent = `${vistas}/${total} posições vistas · ${abertos.length} par(es) para pegar`;
    box.appendChild(info);
    pares.forEach((g, n) => {
      const feito = g.every((i) => feitos.has(i));
      const linha = document.createElement('div');
      linha.className = 'par' + (feito ? ' feito' : '');
      const t = document.createElement('b');
      t.style.color = CORES[n % CORES.length];
      t.textContent = `P${n + 1}: ${g.map((i) => i + 1).join(' + ')}`;
      const b = document.createElement('button');
      b.textContent = feito ? 'Desfazer' : 'Já peguei';
      b.onclick = () => {
        estado.feitos = feito ? estado.feitos.filter((f) => !g.includes(f)) : [...new Set([...estado.feitos, ...g])];
        salvar();
        render();
      };
      linha.append(t, b);
      box.appendChild(linha);
    });
  }

  function desenhar() {
    if (!imagem) return;
    tela.hidden = false;
    $('#vazio').hidden = true;
    tela.width = imagem.width;
    tela.height = imagem.height;
    ctx.drawImage(imagem, 0, 0);
    const a = selecaoTemp || estado.area;
    if (!a) return;
    const esp = Math.max(2, imagem.width / 500);
    ctx.lineWidth = esp;
    ctx.strokeStyle = '#ff7a1a';
    ctx.strokeRect(a.x, a.y, a.w, a.h);
    if (selecaoTemp) return;
    const { total } = dims();
    ctx.strokeStyle = 'rgba(60,255,143,.8)';
    ctx.font = `${Math.round(esp * 7)}px system-ui`;
    ctx.fillStyle = '#fff';
    for (let i = 0; i < total; i++) {
      const r = retanguloCelula(i);
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillText(String(i + 1), r.x + esp * 2, r.y + esp * 8);
    }
  }

  function pontoNaImagem(e) {
    const r = tela.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (tela.width / r.width), y: (e.clientY - r.top) * (tela.height / r.height) };
  }

  tela.addEventListener('mousedown', (e) => {
    if (!marcando) return;
    inicio = pontoNaImagem(e);
    selecaoTemp = { x: inicio.x, y: inicio.y, w: 0, h: 0 };
  });
  window.addEventListener('mousemove', (e) => {
    if (!marcando || !inicio) return;
    const p = pontoNaImagem(e);
    selecaoTemp = { x: Math.min(inicio.x, p.x), y: Math.min(inicio.y, p.y), w: Math.abs(p.x - inicio.x), h: Math.abs(p.y - inicio.y) };
    desenhar();
  });
  window.addEventListener('mouseup', () => {
    if (!marcando || !inicio) return;
    inicio = null;
    if (selecaoTemp.w > 20 && selecaoTemp.h > 20) {
      estado.area = selecaoTemp;
      estado.verso = null;
      estado.cartas = {};
      estado.feitos = [];
      marcando = false;
      $('#btnMarcar').classList.remove('ativo');
      selecaoTemp = null;
      salvar();
      processar();
    } else {
      selecaoTemp = null;
      desenhar();
    }
  });

  $('#btnMarcar').onclick = () => {
    if (!imagem) { status('Cole um print primeiro (Ctrl+V).'); return; }
    marcando = !marcando;
    $('#btnMarcar').classList.toggle('ativo', marcando);
    status(marcando ? 'Arraste um retângulo da borda de fora da primeira carta até a borda de fora da última.' : '');
  };

  $('#selGrade').value = estado.grade;
  $('#selGrade').onchange = (e) => {
    estado.grade = e.target.value;
    estado.cartas = {};
    estado.feitos = [];
    estado.verso = null;
    salvar();
    render();
    desenhar();
    processar();
  };

  $('#btnLimpar').onclick = () => {
    if (!confirm('Apagar as anotações e começar uma rodada nova? (a marcação do tabuleiro é mantida)')) return;
    estado.cartas = {};
    estado.feitos = [];
    salvar();
    render();
    status('Rodada limpa. Cole o próximo print.');
  };

  async function abrirArquivo(arquivo) {
    if (!arquivo || !arquivo.type.startsWith('image/')) return;
    imagem = await createImageBitmap(arquivo);
    desenhar();
    if (!estado.area) {
      marcando = true;
      $('#btnMarcar').classList.add('ativo');
      status('Primeiro uso: arraste um retângulo envolvendo todas as cartas do tabuleiro.');
    } else {
      processar();
    }
  }

  window.addEventListener('paste', (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
    if (item) abrirArquivo(item.getAsFile());
  });
  area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('arrastando'); });
  area.addEventListener('dragleave', () => area.classList.remove('arrastando'));
  area.addEventListener('drop', (e) => {
    e.preventDefault();
    area.classList.remove('arrastando');
    abrirArquivo(e.dataTransfer.files[0]);
  });

  render();
})();
</script>
</body>
</html>
